name: Review Voice
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      full:
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: review-voice-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: QuintinBotes/review-voice@56103be2e9b5dc4515c68055fb0135c4baba2cf4
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          post: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-voice-store-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-voice
          include-hidden-files: true
          if-no-files-found: ignore
